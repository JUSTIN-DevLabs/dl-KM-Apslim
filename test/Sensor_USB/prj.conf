# Apslim Rev.A / nRF Connect SDK v3.4.1 / legacy USB device stack
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_COUNTER=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_PRODUCT="APSLIM Sensor USB Test"
CONFIG_USB_DEVICE_MANUFACTURER="Devlab"

# Only the application owns the CDC UART. No mixed console/log output.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
