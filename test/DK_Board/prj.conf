
# GPIO
CONFIG_GPIO=y

# I2C
CONFIG_I2C=y
CONFIG_PINCTRL=y

# USB CDC ACM - New USB Stack
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# Serial
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# USB Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# Logging
CONFIG_LOG=n
