# APSLIM original HW bring-up main.c
# Raytac MDBT50Q-DB-40 / nRF52840, NCS v3.4.1

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2C=y

# Legacy USB CDC ACM: the original main.c calls usb_enable(NULL).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y

# Disable physical UART console (Raytac UART0 overlaps I2C0 pins).
# USB CDC remains available through uart_poll_out(cdc_dev, ...).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
